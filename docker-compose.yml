services:
    app:
        build: .
        ports:
            - "8000:8000"
        env_file:
            - .env
        environment:
            APP_URL: http://localhost:8000
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: expense_manager
            DB_USERNAME: expense_manager
            DB_PASSWORD: secret
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - storage-data:/var/www/html/storage

    db:
        image: mysql:8.4
        ports:
            - "3306:3306"
        environment:
            MYSQL_DATABASE: expense_manager
            MYSQL_USER: expense_manager
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root-secret
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot-secret"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    mysql-data:
    storage-data:
